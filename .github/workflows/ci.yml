name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: net8.0 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Execute.Library.Signals.sln

      - name: Build
        run: dotnet build Execute.Library.Signals.sln --configuration Release --no-restore

      # The matching and delivery suites are xunit; a watcher that throws must
      # not take the signal_record with it, so the tests are the contract here.
      - name: Test
        run: dotnet test Execute.Library.Signals.sln --configuration Release --no-build --verbosity normal
